name: sync
# מעתיק את קבצי הנסיעות התפעוליות של קו פח (deadhead) מהריפו הראשי (ציבורי — בלי טוקן) ומפרסם ב-Pages.
# בריפו הראשי נשמרים רק 21 יום, וכאן כל ההיסטוריה.
#
# early-patterns ו-early-stops (הארכיון ההיסטורי של "הקו בזמן") הועתקו לכאן עד שהייבוא ההיסטורי הסתיים
# (11.2026), ואז נמחקו מהריפו הראשי. העותק כאן הוא המקור היחיד שלהן — לא מסנכרנים ולא מוחקים אותן.
on:
  schedule:
    - cron: '47 */6 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/sync.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.copy.outputs.changed }}
    steps:
      # רק deadhead — בלי להוריד את כל הארכיון הכבד בכל ריצה
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            deadhead
      - name: הורדת קבצי deadhead מהריפו הראשי
        run: |
          set -euo pipefail
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Transit-Freak/kav-bochan.git /tmp/src
          git -C /tmp/src sparse-checkout set --no-cone '/bus/data/days/*.deadhead.json'
          ls /tmp/src/bus/data/days | wc -l
      - name: העתקה ודחיפה
        id: copy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # בלי --delete: הריפו הראשי מוחק קבצים ישנים מ-21 יום, וכאן הם נשמרים
          mkdir -p deadhead && rsync -a --include='*.deadhead.json' --exclude='*' /tmp/src/bus/data/days/ deadhead/
          rm -rf /tmp/src
          changed=false
          # 01.11: דחיפה נדחתה כי workflow אחר כאן (share-fleet) דחף בינתיים — rebase ורק אז ניסיון חוזר
          push() { git commit -q -m "$1" && changed=true && for i in 1 2 3 4 5; do git push -q origin HEAD:main && return 0; sleep 10; git pull -q --rebase origin main || { git rebase --abort; return 1; }; done; return 1; }
          git add -A deadhead
          if ! git diff --cached --quiet; then push "סנכרון deadhead"; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          du -sh deadhead
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: מקום בדיסק
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
